name: Deploy PnL Dashboards to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Fetch Latest Excel from OneDrive
        env:
          ONEDRIVE_EXCEL_URL: ${{ secrets.ONEDRIVE_EXCEL_URL }}
        run: |
          python -c "
          import os, urllib.request
          url = os.environ.get('ONEDRIVE_EXCEL_URL', '').strip().strip('\"\'')
          if url.startswith('http'):
              print('Attempting to download from OneDrive...')
              fetch_url = url
              if 'download=1' not in fetch_url:
                  fetch_url += ('&download=1' if '?' in fetch_url else '?download=1')
              try:
                  req = urllib.request.Request(fetch_url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read()
                      if data[:4] == b'PK\x03\x04':
                          with open('HeadOffice_Master_PnL.xlsx', 'wb') as f:
                              f.write(data)
                          print(f'Successfully downloaded updated Excel ({len(data)} bytes) from OneDrive!')
                      else:
                          print('Warning: Downloaded content is not a valid Excel file. Keeping existing.')
              except Exception as e:
                  print(f'Notice: Could not fetch from OneDrive URL: {e}')
          else:
              print('No valid ONEDRIVE_EXCEL_URL found. Using existing copy.')
          "

      - name: Run PnL Sync
        run: python sync_pnl.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
