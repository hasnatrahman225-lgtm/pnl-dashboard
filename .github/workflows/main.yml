name: Deploy PnL Dashboards to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Fetch Latest Excel from OneDrive
        env:
          ONEDRIVE_EXCEL_URL: ${{ secrets.ONEDRIVE_EXCEL_URL }}
        run: |
          if [ -n "$ONEDRIVE_EXCEL_URL" ]; then
            echo "Fetching latest HeadOffice_Master_PnL.xlsx from OneDrive..."
            curl -L -o HeadOffice_Master_PnL.xlsx "$ONEDRIVE_EXCEL_URL"
          fi

      - name: Run PnL Sync
        run: python sync_pnl.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
