name: Deploy PnL Dashboards to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl requests

      - name: Fetch Latest Excel from OneDrive
        env:
          ONEDRIVE_EXCEL_URL: ${{ secrets.ONEDRIVE_EXCEL_URL }}
        run: |
          python -c "
          import os, re, requests

          url = os.environ.get('ONEDRIVE_EXCEL_URL', '').strip().strip('\"\'')
          if url.startswith('http'):
              print('Connecting to OneDrive/SharePoint...')
              fetch_url = url
              if 'download=1' not in fetch_url:
                  fetch_url += ('&download=1' if '?' in fetch_url else '?download=1')
              
              s = requests.Session()
              s.headers.update({
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                  'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8'
              })
              
              success = False
              try:
                  resp = s.get(fetch_url, timeout=45, allow_redirects=True)
                  print(f'HTTP Status: {resp.status_code}, Content-Type: {resp.headers.get(\"Content-Type\")}, Size: {len(resp.content)} bytes')
                  
                  if resp.content[:4] == b'PK\x03\x04':
                      with open('HeadOffice_Master_PnL.xlsx', 'wb') as f:
                          f.write(resp.content)
                      print(f'Successfully downloaded updated Excel ({len(resp.content)} bytes) from OneDrive!')
                      success = True
                  else:
                      print(f'Preview of received content: {resp.content[:150]!r}')
                      m = re.search(r'https?://[^\s\"\'<>]+download\.aspx[^\s\"\'<>]+', resp.text)
                      if m:
                          dl_url = m.group(0).replace('&amp;', '&')
                          print('Found direct download link in HTML. Attempting second fetch...')
                          resp2 = s.get(dl_url, timeout=45, allow_redirects=True)
                          if resp2.content[:4] == b'PK\x03\x04':
                              with open('HeadOffice_Master_PnL.xlsx', 'wb') as f:
                                  f.write(resp2.content)
                              print(f'Successfully downloaded via embedded download link ({len(resp2.content)} bytes)!')
                              success = True
              except Exception as e:
                  print(f'Notice during fetch: {e}')
                  
              if not success:
                  print('Warning: Downloaded content is not a valid Excel file. Keeping existing.')
          else:
              print('No valid ONEDRIVE_EXCEL_URL found. Using existing copy.')
          "

      - name: Run PnL Sync
        run: python sync_pnl.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
